<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batcaverna</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <img src="img/logo.png" id="logo">
</header>

<main>

    <section id="esquerda">
        <h1>Bem-Vindo à Batcaverna</h1>
        <img src="img/batman.png" alt="">
    </section>

    <section id="direita">

        <div class="terminal">

            <div class="terminal-top">
                <div class="titulo-terminal">
                    ALFRED TERMINAL
                </div>
            </div>

            <div id="terminal-body">
                <div class="linha-sistema">Alfred Terminal v1.0</div>
                <div class="linha-sistema">Sistema online.</div>
                <div class="linha-sistema">Digite "Ajuda" para ver comandos</div>
                <br>
                <div class="mensagem-alfred">
                    Alfred: Boa noite, senhor. Como posso ajudá-lo?
                </div>
            </div>

            <div class="linha-comando">
                <span class="prompt">BATCAVERNA@WAYNE:</span>
                <input id="pedido" placeholder="Digite um comando..." autocomplete="off">
                <button id="btn-pedido">ENTER</button>
            </div>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
